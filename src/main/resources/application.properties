# Nome da Aplicação e Porta
spring.application.name=gestao-licita-nc
server.port=8080

# Conexão com o Banco de Dados PostgreSQL Local
spring.datasource.url=jdbc:postgresql://localhost:5432/gestaolicitanc_db
spring.datasource.username=postgres
spring.datasource.password=1234

# Configurações do Hibernate (Mágica que cria as tabelas automaticamente para nós)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true